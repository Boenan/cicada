# The artifact workflow — the other half of decision #70.
#
# cicada does **not** build artifacts. It owns versioning, changelogs, tags and
# release objects; this workflow reacts to the tag cicada pushes and attaches the
# binaries and images to the release cicada already created. Keeping the two
# apart is what lets a failed artifact build be retried without touching version
# state, and it is why cicada never grows a cross-compilation matrix of its own.
#
# The contract this file has to satisfy is not a matter of taste — it is already
# written down in two shipped assets, and `cicada/tests/shipped_assets.rs`
# asserts the three halves still meet:
#
#   action.yml        downloads `cicada-<arch>-unknown-linux-musl` and verifies
#                     it against `SHA256SUMS`
#   ci/gitlab-ci.yml  runs `ghcr.io/boenan/cicada:v1`
#
# THE TRIGGER FOOTGUN, in its third form. Workflows do not run on events created
# by the default `GITHUB_TOKEN` — that is the README's "CI-trigger footgun" for
# pull requests, and it applies identically to **tag pushes**. If cicada runs
# with `secrets.GITHUB_TOKEN`, it will push the tag and create the release, this
# workflow will never fire, and the release will sit there looking healthy with
# no binaries on it. Use the PAT the README already tells you to use; the
# `workflow_dispatch` below is the manual repair when it has already happened.

name: artifacts

on:
  push:
    # `tag_format = "v{version}"` in cicada.toml. Covers prereleases too —
    # `v1.5.0-alpha.1` is a tag a tester needs a binary for.
    #
    # Three components, deliberately: this workflow also *publishes* the moving
    # `v0` and `v0.2` tags below, and `v*` would let those re-enter it. TAG would
    # then be `v0`, the version check would compare `0` against the binary's
    # `0.2.0`, and every moving-tag push would leave a failed run behind.
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

  # Re-attaching artifacts to a tag that already exists. This is the retry that
  # #70's separation is *for*: the version state is already correct and must not
  # be recomputed, so this path takes a tag and builds from it, nothing else.
  workflow_dispatch:
    inputs:
      tag:
        description: The existing tag to build artifacts for, e.g. v1.2.3
        required: true

permissions:
  contents: write   # uploading release assets
  packages: write   # pushing to ghcr.io

# Per-tag, because two runs for the same tag would race on `--clobber`. Runs for
# *different* tags are independent and must not queue behind each other.
concurrency: artifacts-${{ inputs.tag || github.ref_name }}

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # One arch failing should not deny the other its evidence.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            # Native arm64, rather than cross-compiling from x86_64. `ring`
            # compiles C, so a cross build needs an aarch64-targeting musl C
            # toolchain; a native runner needs only the `musl-tools` below. If
            # these runners are ever unavailable to this repo, the fallback is
            # `cross`, not a hand-assembled toolchain.
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4
        with:
          # The tag, never the branch tip. On `workflow_dispatch` they are
          # routinely different, and building the wrong commit would publish a
          # binary that does not match the release it is attached to.
          ref: ${{ inputs.tag || github.ref }}

      # The toolchain the published binary is built with, stated rather than
      # inherited from the runner image. `targets:` replaces a `rustup target
      # add`, and pins both halves in one place.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install the musl toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # `ring` builds C, and that C has to be compiled against musl.
          sudo apt-get install -y -qq musl-tools

      - name: Build
        # `--locked` so the published binary is built from the committed
        # dependency graph rather than whatever resolved today.
        run: cargo build --release --locked -p cicada --target "${{ matrix.target }}"

      - name: Strip, name, and check
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/cicada"

          # ~10.7MB unstripped; the symbols are of no use to anyone downloading a
          # release binary, and this is a file every CI run pulls.
          strip "$bin"

          # The binary must agree with the tag it is about to be attached to.
          # `cicada --version` reports CARGO_PKG_VERSION — a number cicada bumped
          # itself — so a mismatch means this workflow is building a commit that
          # is not the release commit, which is silent every other way.
          built="$(./"$bin" --version | awk '{print $2}')"
          want="${TAG#v}"
          if [ "$built" != "$want" ]; then
            echo "::error::tag ${TAG} carries version ${want}, but the binary reports ${built}" >&2
            exit 1
          fi

      # Separated so a test can execute this block whole rather than pick lines
      # out of it — see `the_executable_bit_survives_the_trip_to_a_users_disk`.
      - name: Package
        id: package
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/cicada"

          # The tarball is the unit of publication, and it is built *here*
          # rather than in a later job because the executable bit does not
          # survive any other route. GitHub release assets carry no permissions,
          # and neither does actions/upload-artifact — so a bare binary arrives
          # at the far end non-executable, and anyone who downloads it by hand
          # gets "Permission denied". Inside a tar the mode is recorded and
          # travels intact.
          #
          # Staged in a directory of its own, and that is not tidiness. The
          # repository root already contains a `cicada` **directory** — the
          # crate — so `install … cicada` from here writes *into* it, `tar`
          # archives the source tree instead of the binary, and the check below
          # fails with "./cicada: Is a directory".
          rm -rf dist && mkdir -p dist
          install -m755 "$bin" dist/cicada

          # `-C dist` keeps the archive flat: one `cicada` at its root, which is
          # what `action.yml` and the README both extract.
          tar czf "cicada-${{ matrix.target }}.tar.gz" -C dist cicada

          dist/cicada --version
          tar tvzf "cicada-${{ matrix.target }}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: cicada-${{ matrix.target }}
          path: cicada-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  release-assets:
    name: attach to the release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          # Plain `sha256sum` output, in sorted order so the file is a
          # deterministic function of its inputs. The format matters: `action.yml`
          # verifies with `sha256sum -c`, which wants exactly this.
          ls cicada-*.tar.gz | sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Wait for the release object
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `gh` reads which repository it is talking about from the git remote,
          # and this job has no checkout — there is no remote to read. Without
          # this every call fails with "failed to determine base repo" however
          # healthy the release is, and the retry loop below turns that into a
          # five-minute wait for something that already exists.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Phase B pushes the tag and *then* creates the release object, so this
          # workflow can be running before the thing it uploads to exists. The
          # gap is normally a second or two.
          #
          # It can also never close: if release creation failed, cicada leaves the
          # tag and self-heals on its next run (#56). Waiting forever would hide
          # that, so this gives up and says which of the two happened.
          # The error is kept rather than discarded. A retry loop that throws it
          # away can only ever report "timed out", which is the one thing that
          # was never the cause — the first run of this job waited five minutes
          # on a release that was sitting right there, and said release creation
          # must have failed.
          err="(no attempt made)"
          for i in $(seq 1 60); do
            if err="$(gh release view "$TAG" 2>&1 >/dev/null)"; then
              echo "release ${TAG} is there after ${i} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::no release object for ${TAG} after 5 minutes." >&2
          echo "::error::last error from gh: ${err}" >&2
          echo "::error::If that says the release was not found, cicada created the tag but not the release object; it self-heals on its next run (#56), and this workflow can then be re-run from workflow_dispatch. Anything else is this job's own problem, not cicada's." >&2
          exit 1

      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        # `--clobber` so a re-run repairs a partial upload instead of failing on
        # the assets that already landed.
        run: gh release upload "$TAG" dist/cicada-*.tar.gz dist/SHA256SUMS --clobber

  # ---------------------------------------------------------------------------
  image:
    name: ghcr.io image
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Unpack, named the way buildx asks for them
        run: |
          set -euo pipefail
          # `TARGETARCH` is Docker's spelling (amd64/arm64), not the Rust triple's.
          for pair in amd64:x86_64 arm64:aarch64; do
            docker_arch="${pair%%:*}"
            rust_arch="${pair##*:}"
            tar xzf "dist/cicada-${rust_arch}-unknown-linux-musl.tar.gz" -C dist
            mv dist/cicada "dist/cicada-${docker_arch}"
          done
          # tar restored the mode; this is belt and braces, and cheap.
          chmod +x dist/cicada-amd64 dist/cicada-arm64
          ls -l dist/

      - name: Compute the tags
        id: tags
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${TAG#v}"

          # The exact version, always.
          tags="${image}:${TAG}"

          # The moving tags point at a release people should be upgraded onto by
          # default — so a prerelease gets the exact tag and nothing else.
          # `ghcr.io/boenan/cicada:v1` resolving to an alpha because an alpha was
          # cut most recently is the kind of thing nobody notices until it breaks
          # a pipeline that was pinned to `v1` precisely to avoid surprises.
          case "$version" in
            *-*)
              echo "prerelease: the exact tag only" ;;
            *)
              major="${version%%.*}"
              minor="${version#*.}"; minor="${minor%%.*}"
              tags="${tags},${image}:v${major}.${minor},${image}:v${major},${image}:latest" ;;
          esac

          echo "image=${image}"  >> "$GITHUB_OUTPUT"
          echo "tags=${tags}"    >> "$GITHUB_OUTPUT"
          echo "$tags"

      - uses: docker/setup-qemu-action@v3
        # Only for the `apk add` and the sanity check in the arm64 layer — the
        # binary itself was built natively and is merely copied in.
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ci/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ env.TAG }}

  # ---------------------------------------------------------------------------
  moving-tags:
    name: move v<major> and v<major>.<minor>
    # After the assets, never before: `uses: Boenan/cicada@v0` has to resolve to
    # a release that is actually complete, and moving the tag first would point
    # it at one whose binaries are still uploading.
    needs: release-assets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move them
        run: |
          set -euo pipefail
          version="${TAG#v}"

          # Same rule as the image tags: a prerelease moves nothing. `@v0`
          # resolving to an alpha because an alpha was cut most recently is the
          # failure this exists to prevent, not a special case of it.
          case "$version" in
            *-*) echo "prerelease ${TAG}: moving nothing"; exit 0 ;;
          esac

          major="${version%%.*}"
          minor="${version#*.}"; minor="${minor%%.*}"

          # GitHub Actions resolves `uses: org/repo@v0` against a git ref, and
          # cicada only ever creates exact-version tags (#2) — so nothing else
          # publishes these. They are pure convention and carry no meaning for
          # cicada: `v0` does not parse as a semver, so anchor resolution and
          # Phase B ignore them entirely.
          git tag -f "v${major}" "$TAG"
          git tag -f "v${major}.${minor}" "$TAG"
          git push -f origin "v${major}" "v${major}.${minor}"
          echo "v${major} and v${major}.${minor} now point at ${TAG}"
