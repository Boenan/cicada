name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # `--locked` is not pedantry here, it is the gate that was missing. Cargo
      # records every workspace member's own version in Cargo.lock, so a release
      # commit that bumps the manifests and not the lock produces a repo which
      # fails `cargo build --locked` — and the only build passing that flag was
      # the artifact build, which runs *after* the tag exists. v0.2.0 was cut
      # that way: this job went green, and the release had no binaries.
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  check:
    # Lints the pull request's commits before they land (#12, G2c). No token, no
    # network — which is what makes it safe on a fork's pull request.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: cargo build --release -p cicada --locked
      - run: |
          ./target/release/cicada check \
            --base "origin/${{ github.base_ref }}" \
            --head "${{ github.event.pull_request.head.sha }}"
