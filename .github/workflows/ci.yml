name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  check:
    # Lints the pull request's commits before they land (#12, G2c). No token, no
    # network — which is what makes it safe on a fork's pull request.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: cargo build --release -p cicada
      - run: |
          ./target/release/cicada check \
            --base "origin/${{ github.base_ref }}" \
            --head "${{ github.event.pull_request.head.sha }}"
