# cicada releasing cicada (#21).
#
# Also the worked example the README points at: this is what adopting cicada on
# GitHub looks like, and it is kept honest by being the one this repository runs.
name: release

on:
  push:
    branches: [main]

# Two overlapping runs race on the force-push. Self-correcting, but the wasted
# work is avoidable — and with auto-merge enabled the race in staleness layer 1
# is not theoretical (§No review gate).
concurrency: cicada-release

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, or the changelog is silently incomplete. cicada errors
          # on a shallow clone rather than guessing, but nobody should have to
          # see that error.
          fetch-depth: 0

      # THE BOOTSTRAP. `uses: ./` runs the composite action, and that action
      # installs cicada by downloading a released binary — which, on the run that
      # cuts the *first* release, does not exist. There is no version to download
      # either: `GITHUB_ACTION_REF` is how the action learns which release to
      # fetch, and a local `uses: ./` has no ref, so it would fail with "cannot
      # tell which cicada version to install".
      #
      # The action's first branch is the way out, and it is there on purpose:
      # an already-installed cicada is used as-is, "a self-hosted runner with it
      # baked in, or a previous step that built it". This is that step.
      #
      # It stays after the first release rather than being deleted, because this
      # repo should release itself with the code at HEAD — the thing about to
      # ship — not with whatever binary shipped last time. An adopter copying
      # this workflow deletes this step; the README's worked example does not
      # have it.
      - name: Build cicada from source (self-release bootstrap)
        run: |
          set -euo pipefail
          cargo build --release -p cicada
          echo "${PWD}/target/release" >> "$GITHUB_PATH"

      - uses: ./
        with:
          # NOT `secrets.GITHUB_TOKEN`. Workflows do not run on pull requests
          # the default token creates, so the release PR's checks never start —
          # see "The CI-trigger footgun" in the README. This is not a
          # convenience on an auto-merging repo; it is what makes the loop turn.
          token: ${{ secrets.CICADA_TOKEN || secrets.GITHUB_TOKEN }}
