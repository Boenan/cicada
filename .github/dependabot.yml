# Dependency updates, opened as ordinary pull requests.
#
# This is the other half of `--locked`. CI refuses to build a repo whose
# `Cargo.lock` has drifted from its manifests, which is the correct strictness
# for a tool whose releases have to be reproducible from a tag — but strictness
# with no maintenance path means the lock simply rots. Dependabot supplies the
# path, and every bump it proposes is verified by the same `--locked` build a
# release uses.
version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Version updates default to `direct`, which for cargo means only what
    # Cargo.toml names. rustls, rustls-webpki and webpki-roots are reached only
    # through ureq, so a fixed release of theirs never produced a PR, and the
    # scheduled audit was the first thing to notice (RUSTSEC-2026-0346..0349,
    # 0381, 0382). `all` adds the transitive graph that cargo resolves into
    # Cargo.lock, which is the graph the audit job checks.
    allow:
      - dependency-type: all
    groups:
      # One PR per advisory batch, not one per crate. A TLS fix often moves
      # rustls and rustls-webpki together, and two PRs that each touch
      # Cargo.lock conflict as soon as the first one merges.
      #
      # Applies only when security updates are on in the repository settings;
      # this file configures them but cannot enable them.
      security:
        applies-to: security-updates
        patterns: ["*"]
      # With `all`, minor and patch bumps come every week, most of them
      # lock-only. Grouped, they are one PR to review rather than a queue
      # against the limit above. Majors stay separate: they are the ones that
      # can break the build.
      lockfile:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      # Conventional commits are not a style choice in this repo — cicada
      # computes its own release from them, and `chore` is the type that
      # contributes no version bump (#36). A dependency bump should not cut a
      # release on its own; it rides along with the next one that has a reason.
      #
      # `deps` names no package, which is exactly the case #98 exists for: an
      # unknown scope is fatal only on a commit that can release.
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
