# PURE. No I/O dependencies may appear here — decision #29.
# The manifest is the enforcement: if a crate in this list can open a file,
# a socket, or a subprocess, it does not belong in cicada-core.
[package]
name          = "cicada-core"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[dependencies]
globset.workspace   = true
indexmap.workspace  = true
semver.workspace    = true
serde.workspace     = true
strsim.workspace    = true
thiserror.workspace = true
toml.workspace      = true
toml_edit.workspace = true
saphyr-parser.workspace = true
serde_json.workspace = true
minijinja.workspace = true
