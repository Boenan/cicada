[workspace]
resolver = "3"
members = ["cicada-core", "cicada"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"   # let-chains; verified by the `msrv` CI job, not asserted
license = "MIT OR Apache-2.0"
repository = "https://github.com/boenan/cicada"

[workspace.dependencies]
cicada-core = { path = "cicada-core" }

# pure — usable from cicada-core
globset   = "0.4"
indexmap  = { version = "2", features = ["serde"] }
semver    = { version = "1", features = ["serde"] }
serde     = { version = "1", features = ["derive"] }
strsim    = "0.11"
thiserror = "2"
toml      = "0.8"
toml_edit = "0.22"
saphyr-parser = "0.1.0"
serde_json = "1"
# default features only: builtins + debug + deserialization. No filesystem loader,
# so minijinja stays inside cicada-core's no-I/O rule (#29).
minijinja = "2"

# I/O — cicada only
anyhow  = "1"
jiff    = "0.2"
ureq    = "3"
similar = "2"
clap    = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# dev only
assert_cmd = "2"
predicates = "3"
