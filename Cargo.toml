[workspace]
resolver = "3"
members = ["cicada-core", "cicada"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/boenan/cicada"

[workspace.dependencies]
cicada-core = { path = "cicada-core" }

# pure — usable from cicada-core
globset   = "0.4"
indexmap  = { version = "2", features = ["serde"] }
semver    = "1"
serde     = { version = "1", features = ["derive"] }
strsim    = "0.11"
thiserror = "2"
toml      = "0.8"

# I/O — cicada only
anyhow  = "1"
clap    = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# dev only
assert_cmd = "2"
predicates = "3"
