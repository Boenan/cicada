# cicada releases itself with cicada (#21). This file is both the tool's own
# configuration and its first reference implementation — the worked example an
# adopter copies from.

[settings]
release_branches = ["main", "test-no-pr"]
default_scope    = "cicada"      # unscoped commits are cicada changes

# Rendered (#86): `chore(main): release cicada 0.2.0`. The type stays `chore`, so
# cicada's own release commit still cannot trigger a release (#41).
release_pr_title = "chore({branch}): release {summary}"

[forge]
kind = "github"                  # required — never guessed at release time (#66)
repo = "boenan/cicada"

# One package, not two. `cicada-core` is an implementation detail that ships
# inside the binary; it is not separately released, and registry publishing is
# out of scope (future-work §1). Declaring it here would also trip #24, since
# both crates inherit `version.workspace = true`.
[packages.cicada]
path       = "."
tag_format = "v{version}"
changelog  = "CHANGELOG.md"

[[packages.cicada.updaters]]
kind = "cargo"
path = "cicada/Cargo.toml"       # inherits, so the bump lands on [workspace.package]

# The action's default `version`. `uses: boenan/cicada@v0` reads action.yml at
# whatever commit `v0` points to, and that commit is a release commit, so the
# version written here is the one whose binaries the action downloads.
[[packages.cicada.updaters]]
kind = "generic"
path = "action.yml"
edit = { marker = "x-cicada-version" }

# no [umbrella] — a single-service repo has no aggregate version to declare (#73)
# no [changelog] — the built-in five-row default is what this repo wants (#48)
